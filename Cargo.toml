[package]
name = "firstrun"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rerun-importer-firstrun"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.97"
arrow = { version = "58.4.0", default-features = false }
bytemuck = { version = "1.25.2", features = ["extern_crate_std"] }
getrandom = { version = "0.3.4", features = ["wasm_js"] }
hashbrown = { version = "0.17.1", features = ["serde"] }
indexmap = "2.14.2"
nom = "8.0.0"
nohash-hasher = "0.2.0"
re_build_info = "0.40.0"
re_chunk = { version = "0.40.0", default-features = false }
re_log_encoding = { version = "0.40.0", default-features = false, features = [
    "encoder",
] }
re_log = { version = "0.40.0", features = ["setup"] }
re_log_msg = { version = "0.40.0", default-features = false }
re_log_types = { version = "0.40.0", default-features = false }
re_sdk_types = { version = "0.40.0", default-features = false }
re_types_core = { version = "0.40.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.17"
wasm-bindgen = "0.2.126"

[build-dependencies]
re_build_tools = "0.40.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Camera MJPEG streams are opened over a plain socket and split into JPEGs by the bridge itself
# (see `src/mjpeg.rs`); there is no HTTP client crate and no external process involved.
nt_client = { version = "0.5.1", features = ["struct"] }
re_sdk = "0.40.0"
rmpv = "1.3.0"
tokio = { version = "1.53.2", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "time",
    "signal",
] }

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = true
opt-level = "z"
codegen-units = 1
incremental = false
debug = false
strip = "symbols"
panic = "abort"
overflow-checks = false
debug-assertions = false

[workspace]
members = ["xtask", "."]
